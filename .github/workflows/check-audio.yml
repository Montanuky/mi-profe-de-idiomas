# Comprueba con un reconocedor de voz (Whisper) que cada audio dice lo que debe.
name: Comprobar audios

on:
  workflow_dispatch:

jobs:
  escuchar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install faster-whisper==1.1.1 requests
      - run: python scripts/check_audio.py
      - uses: actions/upload-artifact@v4
        with:
          name: informe-audios
          path: audio-check.json
