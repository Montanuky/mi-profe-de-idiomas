# Graba con una voz noruega real (Piper, gratuita y de código abierto) todas las
# palabras y frases del curso de noruego, y guarda los audios en el repositorio.
name: Voz noruega

on:
  push:
    branches: [main]
    paths: ['audio/no/manifest.json', 'scripts/synthesize_no.py']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  grabar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Piper y ffmpeg
        run: |
          pip install piper-tts==1.4.2
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Descargar la voz noruega
        run: |
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/no/no_NO/talesyntese/medium
          curl -sSfL -o voice.onnx "$base/no_NO-talesyntese-medium.onnx"
          curl -sSfL -o voice.onnx.json "$base/no_NO-talesyntese-medium.onnx.json"

      - name: Grabar los audios
        run: python scripts/synthesize_no.py voice.onnx

      - name: Guardar en el repositorio
        run: |
          rm -f voice.onnx voice.onnx.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/no src/content/audioNo.ts
          git diff --cached --quiet && echo 'Sin cambios' || (git commit -m "Audios en noruego grabados con Piper" && git push)

      - name: Fabricar de nuevo el instalable con los audios
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --ref main
